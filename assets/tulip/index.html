<!DOCTYPE html><html lang="en"><head>
      <title>Roadmap Generator</title>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <meta name="description" content="Website for the Isle of Wight Triumph Sport Six Club, tool to generate roadmaps for convoy routes.">
      <link rel="stylesheet" href="style.css">
      <link rel="canonical" href="https://iow.triumphsportsix.club/roadmap-gen" />
</head>
<style>
table, th, tr, td {
  border: 1px solid black;
  border-collapse: collapse;
}
tr, td {
  height:20%;
  text-align: center; 
  vertical-align: middle;
}
</style>
<script src="roadmap.js">
</script>
<body>
<h1>Roadmap Generator</h1>
This tool generates a simple roadmap for a convoy route.<br>
<button onclick="help()">Help</button>
<form id="frm1">
<label for="InstructionID">Instruction ID:</label><input type="integer" name="InstructionID" value="" size="3"> optional<br>
<label for="interval">Interval:</label><input type="text" name="interval" value="0.4" size="4"><br>
Junction:<br>
<label for="JunctionType">Type:</label><input type="text" name="JunctionType" pattern="[RrMmJjTt]" value="R" size="2">
<label for="exit">Exit:</label><input type="text" name="exit" value="9" size="4">
<label for="others">Other Exits:</label><input type="text" name="others" value="12 3" size="9"><br>
<label for="description">Description:</label><input type="text" name="description" value="<strong>1<sup>st</sup></strong> exit at the roundabout" size="90"><br>
<label for="waypointText">Bulk waypoints:</label><br>
<textarea name="waypointText" rows="8" cols="100">0.4, R 9 12 3, <strong>1<sup>st</sup></strong> exit at the roundabout.
0.6, J 9 3, Turn <strong>Left</strong> at the junction.</textarea><br>
  <input type="reset" value="Reset">
</form> 
<button onclick="AddWayPoint()">Add waypoint</button>
<button onclick="AddWayPoints()">Bulk add waypoints</button>
<button onclick="RemoveInstruction()">Remove waypoint</button>
<button onclick="PreviewRoadmap()">Preview Roadmap</button>
<button onclick="ExportRoadmap()">Export Roadmap</button>

<p id="help"></p>
<p id="output"></p></body></html>
