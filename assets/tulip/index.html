<!DOCTYPE html><html lang="en"><head>
      <title>Roadmap Generator</title>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <meta name="description" content="Website for the Isle of Wight Triumph Sport Six Club, tool to generate roadmaps for convoy routes.">
      <link rel="stylesheet" href="style.css">
      <link rel="canonical" href="https://iow.triumphsportsix.club/roadmap-gen" />
</head>
<style>
table, th, tr, td {
  border: 1px solid black;
  border-collapse: collapse;
}
tr, td {
  height:20%;
  text-align: center; 
  vertical-align: middle;
}
</style>
<script src="roadmap.js">
</script>
<body>
<h1>Roadmap Generator</h1>
This tool generates a simple roadmap for a convoy route.<br>
<button onclick="help()">Help</button>
<form id="frm2">
  instruction ID to remove: <input type="integer" name="input" value=""><br>
</form> 
<form id="frm1">
  Interval: <input type="text" name="interval" value="0.4"><br>
  Mode: <input type="text" name="mode" pattern="[RrMmJjTt]" value="R"><br>
  Exit: <input type="text" name="exit" value="9"><br>
  Other Exits: <input type="text" name="others" value="12 3"><br>
  Description: <input type="text" name="description" value="<strong>1<sup>st</sup></strong> exit at the roundabout"><br>
  Instruction ID: <input type="integer" name="InstructionID" value="">optional<br>
  <input type="reset" value="Reset">
</form> 
<button onclick="AddWaypoint()">add waypoint</button>
<button onclick="RemoveInstruction()">remove waypoint</button>
<button onclick="PreviewRoadmap()">Preview Roadmap</button>
<button onclick="ExportRoadmap()">Export Roadmap</button>

<p id="help"></p>
<p id="output"></p></body></html>
